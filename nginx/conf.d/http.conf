# Plain HTTP server block — redirects everything to HTTPS, except
# the Let's Encrypt renewal challenge, which is served from a webroot
# shared with the host's certbot (see README "Production deployment").

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
