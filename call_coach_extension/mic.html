<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Call Coach - Microphone</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; background: #0b1020; color: #e6e9f2; max-width: 520px; margin: 60px auto; padding: 0 16px; }
    h1 { font-size: 20px; color: #22d3ee; }
    button { background: #22d3ee; color: #0b1020; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
    #status { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Allow the microphone once</h1>
  <p>The coach needs your microphone so it can tell your words apart from the customer's. Chrome will ask once; after that this tab can be closed.</p>
  <button id="allow">Allow microphone</button>
  <p id="status"></p>
  <script src="mic.js"></script>
</body>
</html>
