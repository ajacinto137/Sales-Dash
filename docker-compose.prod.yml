# ============================================================
# PRODUCTION docker-compose file.
#
# This is separate from docker-compose.yml, which remains the
# LOCAL DEVELOPMENT stack (Flask dev server, no nginx, no TLS,
# port 3005 mapped straight to the host). Nothing here changes
# how local dev works.
#
# This file adds:
#   - nginx as a reverse proxy in front of the app (ports 80/443)
#   - gunicorn instead of the Flask dev server for the app itself
#   - HTTPS using a certificate you provide yourself — nginx reads
#     it from SSL_CERTS_DIR (set in .env), expecting fullchain.pem
#     and privkey.pem in that directory
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:
  dashboard:
    build: .
    image: sales-dash:prod
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "false"
    # --workers must stay at 1: the app keeps its loaded data in an
    # in-process global (data_store) guarded by a threading.Lock, not
    # an external cache. Multiple gunicorn worker processes would each
    # get their own independent copy, so requests would randomly see
    # loaded data or None depending which worker handled them.
    # --threads gives concurrency within that single process instead.
    command: >
      sh -c 'gunicorn --bind 0.0.0.0:${APP_PORT:-3005} --workers 1 --threads 4 --timeout 60 app:app'
    expose:
      - "3005"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - dashboard
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Overwrites the nginx image's own default.conf directly, rather
      # than adding a second file alongside it — the image ships a
      # default.conf that would otherwise win as the default server
      # (loaded alphabetically before any other conf.d file).
      - ./nginx/conf.d/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${SSL_CERTS_DIR}:/etc/nginx/certs:ro
      - ./webroot:/var/www/certbot:ro
    restart: unless-stopped
