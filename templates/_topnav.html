<!-- ================= Top Nav =================
     Shared across every team_dashboard.css page (dashboard.html,
     rep_profile.html, bulk_account_view.html, admin/*.html) -- factored
     out 2026-08-17 when the global search bar was added, so the
     templates that used to each hand-copy this block can't drift out of
     sync. Expects `last_refreshed` in context (already passed by every
     route that renders one of the pages above); `current_user` comes
     from app.py's inject_auth_context() context processor, available on
     every template automatically.

     Overview/Main Sales/Service Cancellations/Vision Packages moved OUT
     of this main nav 2026-08-19 (by request -- "the main/global
     navigation currently contains admin-oriented pages that should not
     be there") into the Admin Portal's own nav instead (see
     _admin_nav.html's "Data Tools" group) -- the "Admin" link below is
     now the only entry point into all of that from here. This is a UX
     move only, not a permissions change: those 4 routes (and every
     /admin/* route) were already, and still are, individually guarded by
     @auth.admin_required in app.py regardless of what links here -- see
     README.md "Authorization". The "Admin" link itself stays hidden here
     for non-admins as a convenience; the real protection is still that
     same server-side decorator. -->
<div class="td-topnav">
    <div class="td-topnav-brand">Planet Networks</div>
    <nav class="td-topnav-links">
        {% if current_user and current_user.role == 'Admin' %}
        <a href="{{ url_for('admin_users') }}">Admin</a>
        {% endif %}
        <a class="{{ 'td-topnav-active' if active_page == 'dashboard' else '' }}" href="{{ url_for('dashboard_page') }}">Dashboard</a>
        <!-- Marketing Dashboard V1 (added 2026-08-19) -- wired up to the
             real /marketing route. Login-gated only (@auth.login_required
             on marketing_dashboard_page()), same as Dashboard above -- not
             part of Admin, so no role check here beyond the shared
             current_user-exists guard the rest of this nav already
             assumes. -->
        <a class="{{ 'td-topnav-active' if active_page == 'marketing' else '' }}" href="{{ url_for('marketing_dashboard_page') }}">Marketing Dashboard</a>
    </nav>

    <!-- Global search: reps + customer accounts, debounced fetch to
         /search (see app.py), wired up by static/js/search.js. A no-op
         script on any page that ever stops including this partial. -->
    <div class="td-global-search" data-global-search>
        <input type="search" class="td-search-input td-global-search-input"
               placeholder="Search reps or accounts…" autocomplete="off"
               data-global-search-input>
        <div class="td-global-search-results" data-global-search-results style="display: none;"></div>
    </div>

    <div class="td-topnav-right">
        {% if last_refreshed %}<span class="td-last-refreshed">Last refreshed: {{ last_refreshed }}</span>{% endif %}
        <form action="{{ url_for('refresh') }}?dataset=all" method="post">
            <button type="submit" class="td-btn td-btn-ghost">Refresh Data</button>
        </form>
        {% if current_user %}
        <span class="td-last-refreshed">{{ current_user.display_name }}</span>
        <form action="{{ url_for('logout') }}" method="post">
            <button type="submit" class="td-btn td-btn-ghost">Log Out</button>
        </form>
        {% endif %}
    </div>
</div>
