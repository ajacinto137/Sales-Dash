<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — Planet Networks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/team_dashboard.css') }}">
</head>
<body class="td-body">
<div class="td-auth-page">
    <div class="td-auth-card">
        <div class="td-auth-brand">Planet Networks</div>

        {% if token_error %}
        <h1 class="td-auth-title">Link Unavailable</h1>
        <div class="td-auth-error">{{ token_error }}</div>
        <p class="td-auth-subtitle"><a href="{{ url_for('reset_password_request') }}">Request a new reset link</a></p>
        {% else %}
        <h1 class="td-auth-title">Choose a New Password</h1>

        {% if form_error %}
        <div class="td-auth-error">{{ form_error }}</div>
        {% endif %}

        <form class="td-auth-form" method="post" action="{{ url_for('reset_password_complete', token=token) }}">
            <div class="td-field">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required minlength="8" autofocus autocomplete="new-password">
            </div>
            <div class="td-field">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="td-btn td-btn-primary td-btn-block">Update Password</button>
        </form>
        {% endif %}
    </div>
</div>
</body>
</html>
