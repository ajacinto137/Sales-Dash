<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In — Planet Networks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/team_dashboard.css') }}">
</head>
<body class="td-body">
<div class="td-auth-page">
    <div class="td-auth-card">
        <div class="td-auth-brand">Planet Networks</div>
        <h1 class="td-auth-title">Sales Dashboard</h1>

        {% if error %}
        <div class="td-auth-error">{{ error }}</div>
        {% endif %}

        <form class="td-auth-form" method="post" action="{{ url_for('login', next=next) }}">
            <div class="td-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus autocomplete="username">
            </div>
            <div class="td-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="td-btn td-btn-primary td-btn-block">Log In</button>
        </form>

        <div class="td-auth-links">
            <a href="{{ url_for('reset_password_request') }}">Forgot your password?</a>
        </div>
    </div>
</div>
</body>
</html>
