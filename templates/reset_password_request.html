<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — Planet Networks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/team_dashboard.css') }}">
</head>
<body class="td-body">
<div class="td-auth-page">
    <div class="td-auth-card">
        <div class="td-auth-brand">Planet Networks</div>
        <h1 class="td-auth-title">Reset Password</h1>

        {% if sent %}
        <div class="td-auth-success">If that email has an account, a password reset link is on its way.</div>
        {% else %}
        <p class="td-auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>
        <form class="td-auth-form" method="post" action="{{ url_for('reset_password_request') }}">
            <div class="td-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus autocomplete="username">
            </div>
            <button type="submit" class="td-btn td-btn-primary td-btn-block">Send Reset Link</button>
        </form>
        {% endif %}

        <div class="td-auth-links">
            <a href="{{ url_for('login') }}">&larr; Back to Log In</a>
        </div>
    </div>
</div>
</body>
</html>
