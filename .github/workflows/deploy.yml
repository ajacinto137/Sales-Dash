name: Deploy to production

# Pushing to main redeploys sales.planet.net. Runs on a self-hosted
# runner installed directly on that server (labeled sales-dash-prod)
# rather than a GitHub-hosted runner — GitHub's hosted runner IPs
# couldn't reach the server over SSH (likely a provider-level network
# firewall in front of it, separate from the box's own OS firewall,
# which has no restrictions). A self-hosted runner polls GitHub
# outbound instead, so no inbound access to the server is needed.
#
# Only push-to-main and manual dispatch trigger this — both require
# write access to the repo. Do NOT add a pull_request trigger to this
# workflow: combined with a self-hosted runner on a public repo, that
# would let a forked PR execute arbitrary code on the server.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, sales-dash-prod]
    steps:
      - name: Deploy
        run: /home/padmin/deploy.sh
